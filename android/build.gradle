buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

subprojects{
    afterEvaluate {
        if(it.hasProperty('android')) {
            android {
                buildToolsVersion = "37.0.0"
                compileSdkVersion rootProject.ext.compileSdkVersion
            }
        }
    }
}

allprojects {
    repositories {
        // Detox (E2E testing): exposes the prebuilt native Android driver AAR.
        // Gated behind -PenableDetox=true so release / F-Droid builds never
        // resolve the prebuilt binary AAR from node_modules.
        if (project.hasProperty('enableDetox')) {
            maven {
                url("$rootDir/../node_modules/detox/Detox-android")
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
